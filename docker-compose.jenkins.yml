version: "3.8"

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: job-board-jenkins:latest
    container_name: job_board_jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # Jenkins Web Dashboard
      - "50000:50000"   # Jenkins Inbound Agent port
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net

volumes:
  jenkins_home:
    name: job_board_jenkins_home

networks:
  jenkins_net:
    name: job_board_jenkins_net
