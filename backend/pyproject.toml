[project]
name = "job-board-platform-backend"
version = "0.1.0"
description = "FastAPI Backend for Job Board Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "gunicorn>=21.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["src", "tests", "."]
extraPaths = ["src", "."]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
