[project]
name = "job-board-platform"
version = "0.1.0"
description = "Job Board Platform Monorepo"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.pyright]
include = ["backend"]
extraPaths = ["backend/src", "backend"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend"]
testpaths = ["backend/tests"]
